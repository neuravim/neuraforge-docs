image: node:22-alpine

stages:
  - quality
  - build
  - test
  - package
  - deploy

default:
  tags:
    - bun-node
  interruptible: true

variables:
  NPM_CONFIG_CACHE: .npm
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
  policy: pull-push

before_script:
  - npm ci --cache .npm --prefer-offline

typecheck:
  stage: quality
  script:
    - npx tsc --noEmit

build:
  stage: build
  script:
    - npm run build
  artifacts:
    expire_in: 14 days
    paths:
      - out/
      - .next/

playwright:
  image: mcr.microsoft.com/playwright:v1.58.2-jammy
  stage: test
  tags:
    - bun-node
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run build
    - npx playwright test
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - playwright-report/
      - test-results/

# Optional future Docker build job. Keep disabled until a dedicated docker-build
# runner exists. Prefer Kaniko or rootless BuildKit; use DinD privileged mode only
# on a dedicated/tagged docker-build runner.
docker_build:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  tags:
    - docker-build
  before_script: []
  script:
    - test -n "$CI_REGISTRY_IMAGE"
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" --no-push
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - when: never

# Placeholder for the self-hosted deployment. This must stay manual/protected
# until the target VM, SSH key, and deployment strategy are explicitly wired.
deploy:
  stage: deploy
  tags:
    - release
  before_script: []
  script:
    - echo "Deploy is intentionally manual; wire SSH/registry credentials before enabling."
  environment:
    name: production
    url: https://neuraforge.neuravim.tech
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - when: never
